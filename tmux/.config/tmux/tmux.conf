unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Vim keys in copy mode: v to select, y to copy to the Windows clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"

# Remove the delay after Esc, which otherwise makes Neovim feel laggy
set -sg escape-time 10

# Pass focus changes through, so Neovim can reload files the agent edited
set -g focus-events on

# Mouse: click a pane to focus it, drag borders to resize, wheel to scroll
set -g mouse on

# Keep more scrollback for long agent output
set -g history-limit 50000

# Move between panes with prefix h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# True color, so Neovim themes render correctly
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Reload this file with prefix r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Scratchpad: prefix+t toggles a popup into one persistent "scratch" session
# that follows you across projects. Pressing it again inside detaches.
bind t if-shell -F '#{==:#{session_name},scratch}' 'detach-client' \
    'display-popup -E -w 85% -h 85% -b rounded -T " scratch " "tscratch #{pane_current_path}"'

# Git graph of the current pane's repo, all branches (q to close)
bind g display-popup -E -w 90% -h 90% -b rounded -d "#{pane_current_path}" gitgraph

# Project picker, opens the chosen project with dev
bind o display-popup -E -w 60% -h 50% -b rounded proj
